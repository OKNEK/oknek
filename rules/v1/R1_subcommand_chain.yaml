# R1 — subcommand-chain bypass
#
# Reference rule pack definition. Today the engine registers R1 in code
# (internal/rules/r1.go); YAML loading is a week-2 deliverable per the
# schema documented at https://oknek.com/docs/rules/.

id: R1
name: subcommand-chain bypass
version: 1
authors:
  - oknek-core
references:
  - url: https://adversa.ai/blog/claude-code-security-bypass-deny-rules-disabled/
    label: Adversa CC-643 disclosure (April 2026)
  - url: https://www.theregister.com/2026/04/01/claude_code_rule_cap_raises/
    label: The Register coverage
attack_techniques:
  - mitre_atlas: AML.T0051
  - owasp_asi: ASI05
kind: exec_observed
match:
  any_of:
    - chain_depth:
        gte: 8
threshold:
  default: 8
  configurable: true
action:
  default: block
  configurable: true
  options: [block, warn, allow]
evidence:
  capture:
    - bash_command
    - chain_depth
    - threshold
    - agent_identifier
    - pid
    - ppid
  retain_for: 90d
